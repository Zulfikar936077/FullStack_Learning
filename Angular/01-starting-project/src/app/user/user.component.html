
<div>
    <button (click)="onSelectUser()"> <!--Here, the parenthesis is used as it is the event binding and not a data binding or property binding-->
        <img [src] ="imagePath" [alt] = "name" /> <!--property binding for image source-->
        <span>{{ name }}</span> <!--string interpolation for data binding --> 
      
         
    </button>
</div>
